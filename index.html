<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Citywits Archive</title>

<!-- Preload background for smoother start -->
<link rel="preload" as="video" href="./assets/video/welcome-rainbow2.mp4" type="video/mp4">
<link rel="preload" as="image" href="./assets/images/blue-forest.png">

<style>
  /* ===== Core reset + stack ===== */
  html,body{height:100%;margin:0;background:#000;color:#e8efe8;font-family:system-ui, -apple-system, Segoe UI, Arial, sans-serif;}
  /* Background video/image must never eat clicks */
  #bg-video, #bg-image{
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:-2; pointer-events:none;
  }
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.42);
    z-index:-1; pointer-events:none;
  }
  /* Page shell */
  .page{position:relative; z-index:1; min-height:100svh; display:flex; flex-direction:column;}
  .topbar{
    display:flex; gap:14px; justify-content:center; align-items:center;
    padding:14px 12px; position:sticky; top:0; z-index:2; /* above content */
    backdrop-filter:saturate(1.1) blur(6px);
  }
  .topbtn{
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 16px; border-radius:14px; text-decoration:none; color:#063029;
    background:#39e6b6; font-weight:700; box-shadow:0 8px 26px rgba(0,0,0,.35);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .topbtn:hover{ transform:translateY(-2px); box-shadow:0 12px 34px rgba(0,0,0,.45); }
  .topbtn img{ height:28px; width:auto; border-radius:10px; display:block; }
  .topbtn.secondary{ background:#2ac59a; }

  .wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:28px 16px 60px; }
  .card{
    width:min(980px, 94vw);
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px; padding:28px;
    box-shadow:0 12px 40px rgba(0,0,0,.55);
    text-align:center;
  }
  h1{ margin:0 0 8px; font-weight:700; letter-spacing:.02em; }
  .lead{ opacity:.9; margin:0 0 18px; }
  iframe{
    width:100%; max-width:720px; height:405px;
    border:0; border-radius:10px; background:#000;
  }
  .cta{ margin-top:18px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .btn{
    display:inline-block; padding:12px 18px; border-radius:10px; text-decoration:none;
    background:#39e6b6; color:#063029; font-weight:800; box-shadow:0 6px 22px rgba(0,0,0,.35);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .btn.secondary{ background:#2ac59a; }

  /* Footer icons */
  footer{ display:flex; justify-content:center; gap:14px; padding:18px 10px 24px; }
  .icon{ width:26px; height:26px; display:inline-block; border-radius:6px; overflow:hidden; background:#fff0; }
  .icon img{ width:100%; height:100%; object-fit:contain; display:block; }

  /* Safety net in case some global CSS borked anchors */
  a{ pointer-events:auto !important; }

  /* Optional debug: uncomment briefly if links feel dead */
  /* *{outline:1px solid rgba(255,0,0,.06);} */
</style>
</head>
<body>

  <!-- Background: video + image fallback -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="./assets/video/welcome-rainbow2.mp4" type="video/mp4">
  </video>
  <img id="bg-image" src="./assets/images/blue-forest.png" alt="" onerror="this.style.display='none';" />
  <div class="scrim"></div>

  <div class="page">
    <!-- Two sleek top buttons with your images -->
    <nav class="topbar" aria-label="Primary">
      <a class="topbtn" href="./vault/index.html">
        <img src="./assets/images/multi/emerald-vault.png" alt="">
        <span>The Vault</span>
      </a>
      <a class="topbtn secondary" href="./mayors-office/index.html">
        <img src="./assets/images/multi/mayors-office.png" alt="">
        <span>The Mayor’s Office</span>
      </a>
    </nav>

    <main class="wrap">
      <section class="card" aria-labelledby="welcome">
        <h1 id="welcome">Welcome to the Citywits Archive</h1>
        <p class="lead">A living museum of lost sounds, truth-bombs, and green-lit cult propaganda.<br>Don’t trust the orb.</p>

        <!-- Your featured YouTube -->
        <iframe
          src="https://www.youtube.com/embed/rMbCWwGqgX4?rel=0"
          title="Citywits — Disclosure Dance (Official Video)"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>

        <!-- Mid-page CTAs, if you still want them below the video -->
        <div class="cta">
          <a class="btn" href="./vault/index.html">Enter the City</a>
          <a class="btn secondary" href="./mayors-office/index.html">The Mayor’s Office</a>
        </div>
      </section>
    </main>

    <!-- Social footer (icons live under ./assets/icons/...) -->
    <footer>
      <a class="icon" href="https://music.apple.com/us/album/weirdo-music/1813859181" target="_blank" rel="noopener">
        <img src="./assets/icons/apple-circular.png" alt="Apple Music">
      </a>
      <a class="icon" href="https://open.spotify.com/artist/2tB2LRfIx9ejZCEwAfiyDt" target="_blank" rel="noopener">
        <img src="./assets/icons/spotify-logo-png-icon-spotify-4500-768x287.png" alt="Spotify">
      </a>
      <a class="icon" href="https://www.twitch.tv/citywits" target="_blank" rel="noopener">
        <img src="./assets/icons/twitch.WEBP" alt="Twitch">
      </a>
      <a class="icon" href="https://www.instagram.com/citywits/" target="_blank" rel="noopener">
        <img src="./assets/icons/Instagram_icon.png" alt="Instagram">
      </a>
      <a class="icon" href="https://www.tiktok.com/@citywits" target="_blank" rel="noopener">
        <img src="./assets/icons/tik-tok-logo-transparent-square-701751694793273qftyarldbx.png" alt="TikTok">
      </a>
      <a class="icon" href="https://soundcloud.com/citywits" target="_blank" rel="noopener">
        <img src="./assets/icons/soundcloud.png" alt="SoundCloud">
      </a>
      <a class="icon" href="https://youtube.com/@citywits" target="_blank" rel="noopener">
        <img src="./assets/icons/youtube.png" alt="YouTube">
      </a>
      <a class="icon" href="https://citywits.bandcamp.com" target="_blank" rel="noopener">
        <img src="./assets/icons/bandcamp.png" alt="Bandcamp">
      </a>
    </footer>
  </div>

<script>
  // If the video fails (mobile/data saver), keep the image
  const v = document.getElementById('bg-video');
  v.addEventListener('error', ()=>{ /* silent fail; image stays */ });
  v.addEventListener('loadeddata', ()=>{ document.getElementById('bg-image').style.display='none'; });
</script>
</body>
</html>
