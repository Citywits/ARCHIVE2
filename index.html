
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citywits Archive</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: "Helvetica Neue", sans-serif;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 960px;
      padding: 40px 20px;
    }

    .logo {
      width: 300px;
      max-width: 80%;
      margin: 0 auto 30px;
      display: block;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .blurb {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 40px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-bottom: 40px;
    }

    .video-wrapper iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      border: none;
      border-radius: 10px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 50px;
    }

    .buttons a {
      background-color: #00ffcc;
      color: #000;
      padding: 12px 24px;
      border-radius: 5px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .buttons a:hover {
      background-color: #00c4a0;
    }

    footer {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding-bottom: 40px;
    }

    footer a img {
      height: 32px;
      filter: grayscale(100%) brightness(1.6);
      transition: filter 0.3s ease;
    }

    footer a:hover img {
      filter: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      .blurb { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="Emerald-city/assets/images/logos/citywits-metal-mania.png" alt="Citywits Logo" class="logo" />

    <h1>Welcome to the Citywits Archive</h1>
    <div class="blurb">
      Citywits second self-produced album, <i>Citywits</i> coming soon!! </i><br>
      <strong>inside lies the sum total of Citywits. enter at your own risk</strong>
    </div>

    <div class="video-wrapper">
      <iframe src="https://www.youtube.com/embed/rMbCWwGqgX4" allowfullscreen></iframe>
    </div>

    <div class="buttons">
      <a href="homepage.html">Enter the Emerald City</a>

    </div>

    <footer>
      <a href="https://open.spotify.com/artist/2tB2LRfIx9ejZCEwAfiyDt" target="_blank"><img src="Emerald-city/assets/images/spotif.WEBP" alt="Spotify"/></a>
      <a href="https://www.instagram.com/citywits/" target="_blank"><img src="Emerald-city/assets/images/instagram.JPG" alt="Instagram"/></a>
      <a href="https://www.tiktok.com/@citywits" target="_blank"><img src="Emerald-city/assets/images/ttklogo.PNG" alt="TikTok"/></a>
      <a href="https://www.youtube.com/@citywits" target="_blank"><img src="Emerald-city/assets/images/youtube.PNG" alt="YouTube"/></a>
      <a href="https://soundcloud.com/citywits" target="_blank"><img src="Emerald-city/assets/images/soundcloudlogo.PNG" alt="SoundCloud"/></a>
      <a href="https://citywits.bandcamp.com" target="_blank"><img src="Emerald-city/assets/images/bandcamp.PNG" alt="Bandcamp"/></a>
    </footer>
  </div>
</body>
</html>
