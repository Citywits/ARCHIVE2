<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citywits Archive</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #fff;
      background-image: url('assets/video/cityliftoff.mp4'); /* optional */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      backdrop-filter: blur(5px);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.5); /* semi-transparent overlay */
      border-radius: 12px;
    }

    .logo {
      max-width: 80%;
      height: auto;
      margin-bottom: 30px;
    }

    .blurb {
      font-size: 1.25rem;
      margin-bottom: 30px;
      color: #eee;
    }

    iframe {
      width: 100%;
      height: 450px;
      max-width: 800px;
      border: none;
      margin-bottom: 30px;
      border-radius: 8px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .buttons a {
      background-color: #00ffcc;
      color: #000;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .buttons a:hover {
      background-color: #00ccb0;
    }

    footer {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      padding-bottom: 20px;
    }

    footer a img {
      height: 30px;
      width: auto;
      filter: grayscale(100%) brightness(1.5);
      transition: filter 0.3s ease;
    }

    footer a:hover img {
      filter: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/images/logos/citywits-metal-mania.png" alt="Citywits Logo" class="logo"/>

    <div class="blurb">
      Welcome to the Citywits Archive — a living museum of lost sounds, truth-bombs, and green-lit cult propaganda.<br/>
      Don’t trust the orb.
    </div>

    <iframe src="https://www.youtube.com/embed/rMbCWwGqgX4" allowfullscreen></iframe>

    <div class="buttons">
      <a href="homepage.html">Enter the City</a>
      <a href="mayors-office.html">The Mayor’s Office</a>
    </div>

    <footer>
      <a href="https://open.spotify.com/artist/2tB2LRfIx9ejZCEwAfiyDt" target="_blank">
        <img src="assets/icons/spotify-logo-png-icon-spotify-4500-768x287.png" alt="Spotify"/>
      </a>
      <a href="https://www.instagram.com/citywits/" target="_blank">
        <img src="assets/icons/Instagram_icon.png" alt="Instagram"/>
      </a>
      <a href="https://www.tiktok.com/@citywits" target="_blank">
        <img src="assets/icons/tik-tok-logo-transparent-square-701751694793273qftyarldbx.png" alt="TikTok"/>
      </a>
      <a href="https://www.youtube.com/@citywits" target="_blank">
        <img src="assets/icons/youtube.png" alt="YouTube"/>
      </a>
      <a href="https://soundcloud.com/citywits" target="_blank">
        <img src="assets/icons/soundcloud.png" alt="SoundCloud"/>
      </a>
      <a href="https://citywits.bandcamp.com" target="_blank">
        <img src="assets/icons/bandcamp.png" alt="Bandcamp"/>
      </a>
    </footer>
  </div>
</body>
</html>
