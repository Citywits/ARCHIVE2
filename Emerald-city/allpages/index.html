<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citywits — Welcome to the City</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Bogle&family=Metal&family=Metal+Mania&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #eaeaea;
      --muted: #ccc;
      --accent: #00d084;
      --max-content-width: 900px;
      --bg: #0b0d0e;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "BBH Sans Bogle", sans-serif;
      overflow-x: hidden;
    }

    /* Polaroid frame overlay */
    .polaroid-frame {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: center / contain no-repeat url("Emerald-city/assets/images/polaroid-background.png");
      pointer-events: none;
    }

    .content-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 6vh 4vw;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Header */
    .header-img {
      width: min(90%, 800px);
      max-width: 90vw;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
      margin-bottom: 3vh;
    }

    /* Section blocks */
    .section {
      width: 100%;
      max-width: var(--max-content-width);
      margin-bottom: 4vh;
      text-align: center;
    }

    .welcome-text {
      font-family: "Playfair Display", serif;
      font-size: 1.3rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .video-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      border: 2px solid #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: "Metal Mania", cursive;
      font-size: 1.2rem;
    }

    /* Welcome button */
    .welcome-button {
      width: 300px;
      margin: 4vh auto;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .welcome-button:hover {
      transform: scale(1.04);
    }

    /* Social icons */
    .socials {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-top: 2vh;
    }
    .socials img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      transition: transform 0.2s ease;
    }
    .socials img:hover {
      transform: scale(1.15);
    }

    footer {
      text-align: center;
      margin-top: 6vh;
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>

<body>
  <!-- Polaroid border overlay -->
  <div class="polaroid-frame"></div>

  <!-- Main content inside frame -->
  <div class="content-wrap">
    <!-- Header -->
    <img src="Emerald-city/assets/images/metal-writing-white.png" alt="Citywits Header" class="header-img">

    <!-- Welcome message -->
    <div class="section">
      <p class="welcome-text">
        Welcome to the City — where analog ghosts and digital dreams collide.  
        This is the home of <strong>Citywits</strong>, a sonic archive of strange truths and weirdo music.
      </p>
    </div>

    <!-- Album promo video placeholder -->
    <div class="section">
      <div class="video-placeholder">
        [ Album Promo Video Placeholder ]
      </div>
    </div>

    <!-- Welcome to the City button -->
    <div class="section">
      <img src="Emerald-city/assets/images/cwcitybanner.jpeg" alt="Welcome to the City" class="welcome-button">
    </div>

    <!-- Social links -->
    <div class="section socials">
      <a href="https://citywits.bandcamp.com" target="_blank"><img src="Emerald-city/assets/images/bandcamp.PNG" alt="Bandcamp"></a>
      <a href="https://www.youtube.com/@citywits" target="_blank"><img src="Emerald-city/assets/images/youtube.PNG" alt="YouTube"></a>
      <a href="https://www.instagram.com/citywits/" target="_blank"><img src="Emerald-city/assets/images/instagram.JPG" alt="Instagram"></a>
      <a href="https://open.spotify.com/artist/2tB2LRfIx9ejZCEwAfiyDt" target="_blank"><img src="Emerald-city/assets/images/spotif.WEBP" alt="Spotify"></a>
    </div>

    <footer>© 2025 Citywits. All rights reserved.</footer>
  </div>
</body>
</html>
