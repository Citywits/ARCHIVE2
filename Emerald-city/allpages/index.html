
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citywits Archive</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Bogle&family=Metal+Mania&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: "BBH Sans Bogle", sans-serif;
            text-align: center;
        }

        .polaroid-wrapper {
            width: 100vw;
            max-width: 100vw;
            margin: 0 auto;
            padding-top: 40px;
        }

        .polaroid-img {
            width: 95vw;
            max-width: 95vw;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .logo {
            width: 450px;
            max-width: 80vw;
            margin: 20px auto;
            display: block;
        }

        .enter-btn {
            margin-top: 30px;
            padding: 12px 25px;
            background: #2ef2c0;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-family: "BBH Sans Bogle", sans-serif;
        }

        .enter-btn:hover {
            opacity: .85;
        }

        .content {
            margin-top: 40px;
            padding-bottom: 80px;
        }
    </style>
</head>
<body>

    <!-- LOGO -->
    <img src="Emerald-city/assets/images/metal-logo-no-bg.PNG" class="logo">

    <div class="content">
        <h1>Welcome to the Citywits Archive</h1>
        <p>The second self-produced Citywits album is coming soon.<br>Enter at your own risk.</p>

        <!-- FULLSCREEN POLAROID FRAME -->
        <div class="polaroid-wrapper">
            <img src="Emerald-city/assets/images/polaroid-background.png" class="polaroid-img">
        </div>

        <!-- ENTER BUTTON -->
        <button class="enter-btn" onclick="window.location.href='homepage.html'">
            Enter the Emerald City
        </button>
    </div>

</body>
</html>
